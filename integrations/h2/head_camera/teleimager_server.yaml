{
  "camera": {
    "head_camera": {
      "enable_zmq": true,
      "zmq_port": 55558,
      "enable_webrtc": false,
      "type": "gstreamer",
      "image_shape": [
        720,
        1280
      ],
      "binocular": false,
      "fps": 30,
      "gst_pipeline": "nvarguscamerasrc sensor-id=0 ! video/x-raw(memory:NVMM),width=1280,height=720,framerate=30/1 ! nvvidconv ! video/x-raw,format=I420 ! jpegenc quality=80 ! appsink name=sink"
    }
  }
}
